<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estoque.css">
</head>
<body>
    <nav class="navbar navbar-dark px-3">
        <span class="navbar-brand">Estoque</span>
        <div>
            <a href="/index.html" class="btn btn-outline-light btn-sm me-2">Início</a>
            <span id="nomeUsuario" class="text-light me-2 nome-usuario"></span>
            <a href="/api/auth/logout" class="btn btn-outline-light btn-sm">Sair</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="alertaDiv" class="alert alert-danger alerta-estoque alert-dismissible fade show" style="display: none;">
            <strong id="alertaMensagem"></strong>
            <button type="button" class="btn-close" onclick="document.getElementById('alertaDiv').style.display='none'"></button>
        </div>

        <div class="row">
            <div class="col-md-7">
                <h5>Produtos em Estoque (ordem alfabética)</h5>
                <table class="table tabela-estoque">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Estoque Atual</th>
                            <th>Mínimo</th>
                            <th>Selecionar</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaEstoque"></tbody>
                </table>
            </div>

            <div class="col-md-5">
                <div class="card card-formulario">
                    <div class="card-header">
                        Nova Movimentação
                    </div>
                    <div class="card-body">
                        <input type="hidden" id="produtoIdMov">
                        <div class="mb-2">
                            <label class="form-label">Produto Selecionado</label>
                            <input type="text" class="form-control" id="nomeProdutoMov" readonly>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Tipo *</label>
                            <select class="form-select" id="tipoMov" required>
                                <option value="">Selecione</option>
                                <option value="entrada">Entrada</option>
                                <option value="saida">Saída</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Quantidade *</label>
                            <input type="number" class="form-control" id="quantidadeMov" min="1" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Data *</label>
                            <input type="date" class="form-control" id="dataMov" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Observação</label>
                            <textarea class="form-control" id="obsMov" rows="2"></textarea>
                        </div>
                        <button class="btn-registrar w-100" onclick="registrarMovimentacao()">Registrar Movimentação</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/estoque.js"></script>
</body>
</html>
